name: Frontend CI

on:
  workflow_call:
  push:
      branches: [frontend]
  pull_request:
      branches: [frontend]

jobs:
    lint:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v3

            - name: Cache node_modules
              uses: actions/cache@v3
              with:
                path: Frontend/node_modules
                key: npm-${{ hashFiles('Frontend/package-lock.json') }}
                restore-keys: |
                  npm-

            - name: Install dependencies
              run: npm ci
              working-directory: Frontend/

            - name: Lint code
              run: npm run lint property-manager
              working-directory: Frontend
        
    audit:
      runs-on: ubuntu-22.04
      needs: lint
      steps:
        - uses: actions/checkout@v3

        - name: Cache node_modules
          uses: actions/cache@v3
          with:
              path: Frontend/node_modules
              key: npm-${{ hashFiles('Frontend/package-lock.json') }}
              restore-keys: |
                npm-
            
        - name: Install dependencies
          run: npm ci
          working-directory: Frontend/

        - name: Audit packages
          run: npm audit || [ $? -eq 1 ] || exit $?
          working-directory: Frontend/
          
        - name: Fail on critical vulnerabilites 
          run: npm audit --audit-level=critical
          working-directory: Frontend/

    build-library:
      runs-on: ubuntu-22.04
      needs: audit
      steps:
        - uses: actions/checkout@v3
        
        - name: Cache node_modules
          uses: actions/cache@v3
          with:
            path: Frontend/node_modules
            key: npm-${{ hashFiles('Frontend/package-lock.json') }}
            restore-keys: |
              npm-

        - name: Install dependencies
          run: npm ci
          working-directory: Frontend

        - name: Build shared library
          run: npm run build shared
          working-directory: Frontend

    build:
        runs-on: ubuntu-22.04
        needs: [audit, build-library]
        steps:
            - uses: actions/checkout@v3

            - name: Cache node_modules
              uses: actions/cache@v3
              with:
                path: Frontend/node_modules
                key: npm-${{ hashFiles('Frontend/package-lock.json') }}
                restore-keys: |
                  npm-

            - name: Install dependencies
              run: npm ci
              working-directory: Frontend

            - name: Build Angular website
              run: npm run build property-manager
              working-directory: Frontend
      
    Unit-Tests:
      runs-on: ubuntu-22.04
      needs: build
      steps:
          - uses: actions/checkout@v3

          - name: Cache node_modules
            uses: actions/cache@v3
            with:
                path: Frontend/node_modules
                key: npm-${{ hashFiles('Frontend/package-lock.json') }}
                restore-keys: |
                  npm-

          - name: Install dependencies
            run: npm ci
            working-directory: Frontend

          - name: Run unit tests
            run: npm run test property-manager -- --include='**/*.spec.ts' --watch=false --browsers=ChromeHeadlessCI
            working-directory: Frontend
    
    Integration-Tests:
      runs-on: ubuntu-22.04
      needs: build
      steps:
        - uses: actions/checkout@v3

        - name: Start DB
          run: docker compose -f docker-compose.yml up -d postgres flyway

        - name: Set up JDK
          uses: actions/setup-java@v3
          with:
            java-version: '21'
            distribution: 'temurin' 

        - name: Build backend
          run: ./gradlew bootJar
          working-directory: Backend/property-management

        - name: Start backend
          run: java -jar build/libs/property-management-*.jar &
          working-directory: Backend/property-management

        - name: Wait for backend
          run: |
            for i in {1..30}; do
              if curl -s http://localhost:8080/actuator/health | grep '"status":"UP"' > /dev/null; then
                echo "Backend is ready!"
                exit 0
              fi
              echo "Waiting for backend..."
              sleep 5
            done
            exit 1

        - name: Cache node_modules
          uses: actions/cache@v3
          with:
              path: Frontend/node_modules
              key: npm-${{ hashFiles('Frontend/package-lock.json') }}
              restore-keys: |
                npm-

        - name: Install dependencies
          run: npm ci
          working-directory: Frontend

        - name: Run integration tests
          run: npm run test property-manager -- --include='**/*.integration.spec.ts' --watch=false --browsers=ChromeHeadlessCI
          working-directory: Frontend

        - name: Shutdown
          if: always()
          run: docker compose -f docker-compose.yml down -v