name: Frontend CI

on:
  workflow_call:
  push:
      branches: [frontend]
  pull_request:
      branches: [frontend]

jobs:
  
    Integration-Tests:
      runs-on: ubuntu-22.04
      steps:
        - uses: actions/checkout@v3

        - name: Build backend
          run: docker build -t backend-test -f Backend/property-management/Dockerfile Backend/property-management

        - name: Start DB and backend
          run: |
            cat > docker-compose.ci.yml <<EOF
            version: '3.9'
            services:
              postgres:
                image: postgres:15
                environment:
                  POSTGRES_DB: property_management
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: pg123
                ports:
                  - "5432:5432"
              backend:
                image: backend-test
                depends_on:
                  - postgres
                environment:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/property_management
                  SPRING_DATASOURCE_USERNAME: postgres
                  SPRING_DATASOURCE_PASSWORD: pg123
                ports:
                  - "8080:8080"
            EOF

            docker compose -f docker-compose.ci.yml up -d

        - name: Wait for backend
          run: |
            for i in {1..30}; do
              if curl -s http://localhost:8080/actuator/health | grep '"status":"UP"' > /dev/null; then
                echo "Backend is ready"
                exit 0
              fi
              echo "Waiting for backend..."
              sleep 5
            done
            exit 1

        - name: Cache node_modules
          uses: actions/cache@v3
          with:
              path: Frontend/node_modules
              key: npm-${{ hashFiles('Frontend/package-lock.json') }}
              restore-keys: |
                npm-

        - name: Install dependencies
          run: npm ci
          working-directory: Frontend

        - name: Debug backend logs
          run: docker compose -f docker-compose.ci.yml logs backend

        - name: Run integration tests
          run: npm run test -- --include='**/*.integration.spec.ts' --watch=false --browsers=ChromeHeadlessCI
          working-directory: Frontend

        - name: Shutdown
          if: always()
          run: docker compose -f docker-compose.yml down -v && docker rm -f backend || true