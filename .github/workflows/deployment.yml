name: Deploy Backend and Frontend

on:
    push:
        branches: [main, dev]

jobs:
    backend:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v3

            - name: Set up JDK
              uses: actions/setup-java@v3
              with:
                java-version: '21'
                distribution: 'temurin' 
            
            - name: Build JAR
              run: ./gradlew clean build -x test
              working-directory: Backend/property-management

            - name: Clean old JAR file on EC2
              uses: appleboy/ssh-action@v0.1.7
              with: 
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_KEY }}
                script: |
                  rm -f /home/${{ secrets.EC2_USER }}/Property-Management/EC2/property-managemnet-0.0.1-SNAPSHOT.jar

            - name: Verify JAR was built in GitHub runner
              run: |
                echo "Current directory:"
                pwd
                echo "Checking if JAR exists in GitHub runner:"
                ls -la Backend/property-management/build/libs/
                echo "Full path:"
                find . -name "*.jar" -type f

            - name: Copy JAR to EC2
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_KEY }}
                source: ${{ github.workspace }}/Backend/property-management/build/libs/property-managemnet-0.0.1-SNAPSHOT.jar
                target: /home/${{ secrets.EC2_USER }}/Property-Management/EC2/
                overwrite: true

            - name: Verify JAR was copied
              uses: appleboy/ssh-action@v0.1.7
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_KEY }}
                script: |
                  echo "JAR file location:"
                  ls -la /home/${{ secrets.EC2_USER }}/Property-Management/EC2/property-managemnet-0.0.1-SNAPSHOT.jar
                  echo "File size:"
                  du -h /home/${{ secrets.EC2_USER }}/Property-Management/EC2/property-managemnet-0.0.1-SNAPSHOT.jar
                
            - name: Run migrations
              uses: appleboy/ssh-action@v0.1.7
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_KEY}}
                script: | 
                    cd /home/${{ secrets.EC2_USER }}/Property-Management/EC2
                    flyway \
                    -url=${{ secrets.DB_URL }} \
                    -user=${{ secrets.DB_USER }} \
                    -password=${{ secrets.DB_PASSWORD }} \
                    -locations=filesystem:/home/${{ secrets.EC2_USER }}/Property-Management/Backend/property-management/migrations \
                    migrate
                
            - name: Restart Backend
              uses: appleboy/ssh-action@v0.1.7
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_KEY }}
                script: |
                    sudo systemctl daemon-reload
                    sudo systemctl restart property-backend
                    sudo systemctl status property-backend --no-pager

    frontend:
        runs-on: ubuntu-22.04
        needs: backend
        steps:
            - uses: actions/checkout@v3

            - name: Install dependencies
              run: npm ci
              working-directory: Frontend

            - name: Build Angular website
              run: npm run build property-manager -- --configuration=production
              working-directory: Frontend
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Deploy to S3
              run: aws s3 sync Frontend/dist/property-manager s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete