<div class="profile-container">
    <div class="profile-card">
        <h2 class="profile-title">Project History</h2>
        <textarea
            class="profile-textarea"
            placeholder="Provide a brief description of past projects, including project types, scope, duration, and key achievements"
            [(ngModel)]="description"
            name="description"
        ></textarea>
        
        <div class="profile-upload-group">
            <label for="projDocs" [class]="getUploadLabelClass('projectRecords')">
                <img src="https://img.icons8.com/ios/50/copy.png" alt="file upload" class="profile-upload-icon" />
                {{ getProjectRecordsStatusText() }}
            </label>
            <input 
                type="file" 
                hidden 
                id="projDocs" 
                accept="application/pdf"
                (change)="onProjectRecordsSelected($event)"
                [disabled]="uploadStates.projectRecords.uploading" />
        </div>
        
        <div class="profile-upload-group">
            <label for="projImgs" [class]="getUploadLabelClass('projectImages')">
                <img src="https://img.icons8.com/ios/50/image.png" alt="file upload" class="profile-upload-icon" />
                {{ getProjectImagesStatusText() }}
            </label>
            <input 
                type="file" 
                hidden 
                id="projImgs" 
                accept="image/jpeg,image/jpg,image/png,image/gif,image/webp" 
                multiple 
                (change)="onImageSelect($event)"
                [disabled]="uploadStates.projectImages.uploading" />
            
            <!-- Image previews -->
            <div *ngIf="imagePreviewUrls.length > 0" class="image-preview-container">
                <img 
                    *ngFor="let url of imagePreviewUrls" 
                    [src]="url" 
                    alt="Project image preview" 
                    class="image-preview" />
            </div>
            <div *ngIf="selectedImages.length > 0" class="image-count">
                {{ selectedImages.length }} image(s) selected
            </div>
        </div>
        
        <div class="profile-actions">
            <button type="button" class="profile-btn-yellow" (click)="back.emit()">Back</button>
            <button 
                type="button" 
                class="profile-btn-yellow" 
                (click)="emitRelevantData()"
                [disabled]="isUploading()">
                {{ isUploading() ? 'Uploading...' : 'Done' }}
            </button>
        </div>
    </div>
</div>
