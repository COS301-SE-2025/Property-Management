<div class="bg-white dark:bg-gray-600 rounded-2xl shadow-md p-8 max-w-xl mx-auto">
  <form [formGroup]="form" class="flex flex-col gap-5">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-2">Enter Your Details</h3>

    <input type="text" formControlName="name" placeholder="Full Name / Company Name" class="input" />
    <input type="email" formControlName="email" placeholder="Email Address" class="input" />
    <input type="text" formControlName="phone" placeholder="Phone Number" class="input" />

    <app-address-map [control]="form.controls.address"></app-address-map>

    <div class="flex gap-4">
      <input type="text" formControlName="city" placeholder="City" class="input flex-1" />
      <input type="text" formControlName="suburb" placeholder="Suburb" class="input flex-1" />
    </div>

    <div class="flex gap-4 items-center">
      <input type="text" formControlName="postalCode" placeholder="Postal Code" class="input flex-1" />

      <p-multiselect
        formControlName="specializations"
        [options]="specializationOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select Specializations"
        class="flex-1"
      ></p-multiselect>
    </div>

    <div class="flex justify-end mt-6">
      <button
        type="button"
        (click)="emitRelevantData()"
        class="btn-yellow"
      >
        Next
      </button>
    </div>
  </form>
</div>
