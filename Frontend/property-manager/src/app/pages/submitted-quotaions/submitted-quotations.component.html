<div class="min-h-screen p-8" [@fadeInStagger]="true" [ngStyle]="{ 'background-color': 'var(--bg-color)', 'color': 'var(--text-color)' }">
  <div class="ml-25 mb-12">
    <h2 class="text-3xl font-semibold font-lato text-black animate-item"
      [ngStyle]="{'background-color': 'var(--input-bg-color)', 'color': 'var(--input-text-color)'}">Submitted quotations
    </h2>
    <div class="w-60 h-1 bg-yellow-300 mt-2"></div>
  </div>

  
  <div *ngIf="quotes.length > 0; else noQuotes" class="flex flex-wrap gap-6 justify-center animate-item">
    <div *ngFor="let quote of quotes; let i = index"
      class="w-64 bg-white rounded border border-gray-300 shadow-sm p-4 flex flex-col justify-between rounded-lg dark:bg-gray-800">
      <div class="border-b-2 border-yellow-300 pb-2 mb-4">
        <h3 class="text-center font-semibold text-black dark:text-gray-200">Quote #{{ i + 1 }}</h3>
      </div>

      <div class="text-sm text-gray-800 space-y-1 dark:text-gray-300">
        <p><strong>Amount:</strong> {{quote.amount | currency:'ZAR':'symbol-narrow':'1.2-2'}}</p>
        <p><strong>Status:</strong> {{quote.status}}</p>
        <p><strong>Date:</strong> {{quoteDate(quote)}}</p>
        <p><strong>Document:</strong> {{quote.doc}}</p>

        <div class="mt-4 flex justify-center">
          <span [ngClass]="{
            'bg-gray-300 text-black': quote.status === 'pending',
            'bg-green-500 text-white': quote.status === 'successful',
            'bg-red-600 text-white': quote.status === 'unsuccessful'
          }" class="text-xs font-medium px-3 py-1 rounded">
            {{ quote.status }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noQuotes>
  <div  class="flex flex-col items-center justify-center w-full mt-20 text-center text-gray-400 animate-item">
            <img src="/assets/icons/empty-folder.svg" alt="No tasks" class="w-24 h-24 mb-4 opacity-60" />
            <p class="text-xl font-semibold mb-2">No Quotes available</p>
            <p class="text-sm"> You have not submitted any quotes</p>
        </div>
</ng-template>
</div>
