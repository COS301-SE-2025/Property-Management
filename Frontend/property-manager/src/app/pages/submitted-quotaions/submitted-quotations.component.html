<app-header></app-header>

<div class="min-h-screen p-8" [ngStyle]="{ 'background-color': 'var(--bg-color)', 'color': 'var(--text-color)' }">
  <div class="ml-25 mb-12">
    <h2 class="text-3xl font-semibold font-lato text-black"
      [ngStyle]="{'background-color': 'var(--input-bg-color)', 'color': 'var(--input-text-color)'}">Submitted quotations
    </h2>
    <div class="w-60 h-1 bg-yellow-300 mt-2"></div>
  </div>

  <!-- Main content area -->
  <div *ngIf="quotes.length > 0; else noQuotes" class="flex flex-wrap gap-6 justify-center">
    <div *ngFor="let quote of quotes; let i = index"
      class="w-64 bg-white rounded border border-gray-300 shadow-sm p-4 flex flex-col justify-between rounded-lg">
      <div class="border-b-2 border-yellow-300 pb-2 mb-4">
        <h3 class="text-center font-semibold text-black">Quote #{{ i + 1 }}</h3>
      </div>

      <div class="text-sm text-gray-800 space-y-1">
        <p><strong>Amount:</strong> {{quote.amount | currency:'ZAR':'symbol-narrow':'1.2-2'}}</p>
        <p><strong>Status:</strong> {{quote.status}}</p>
        <p><strong>Date:</strong> {{quoteDate(quote)}}</p>
        <p><strong>Document:</strong> {{quote.doc}}</p>

        <div class="mt-4 flex justify-center">
          <span [ngClass]="{
            'bg-gray-300 text-black': quote.status === 'pending',
            'bg-green-500 text-white': quote.status === 'successful',
            'bg-red-600 text-white': quote.status === 'unsuccessful'
          }" class="text-xs font-medium px-3 py-1 rounded">
            {{ quote.status }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noQuotes>
  <div class="text-center py-12 flex flex-col items-center">
    
    <img src="assets/icons/empty-folder.svg" 
         alt="No quotes" 
         class="w-24 h-24 mb-4 opacity-75">
    
  
    <p class="text-gray-500 text-lg">No quotes found</p>
    
    
    <p class="text-gray-400 text-sm mt-2">You haven't submitted any quotations yet</p>
  </div>
</ng-template>
</div>
