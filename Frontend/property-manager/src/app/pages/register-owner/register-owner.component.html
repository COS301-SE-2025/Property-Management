<div class="flex w-full justify-center items-center h-screen dark:bg-gray-100 bg-gray-100">
  <div class="flex w-[700px] h-[400px] shadow-lg rounded overflow-hidden border">
    <div class="w-2/6 bg-white flex flex-col items-center justify-center p-6">
      <img class="h-24 mb-4" src="assets/images/PM-Logo.png" alt="App logo">
      <p class="font-semibold text-lg">Property Manager</p>
    </div>
    <div class="w-4/6 propertyYellow-bg p-13 flex flex-col justify-center items-center space-y-4">
      <p class="text-center text-xl font-semibold">Register as Owner</p>

      <p-floatlabel variant="on">
        <img *ngIf="!email" class="absolute top-3 left-3 h-5 w-5 pointer-events-none" src="assets/icons/mail.svg" alt="">
        <input class="w-80 border rounded !bg-white" pInputText type="email" id="email_label" [(ngModel)]="email" autocomplete="off">
        <label class="pl-6" for="email_label">Enter email address</label>
        <p *ngIf="errors.email" role="alert" class="text-red-500 text-sm pl-2">{{ errors.email }}</p>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <img *ngIf="!contactNumber" class="absolute top-3 left-3 h-5 w-5 pointer-events-none" src="assets/icons/telephone.svg" alt="">
        <input class="w-80 border rounded !bg-white" pInputText type="tel" id="contact_label" [(ngModel)]="contactNumber" autocomplete="off">
        <label class="pl-6" for="contact_label">Enter Contact number</label>
        <p *ngIf="errors.contactNumber" role="alert" class="text-red-500 text-sm pl-2">{{ errors.contactNumber }}</p>
      </p-floatlabel>

      <p-floatlabel variant="on" class="relative">
        <img *ngIf="!password" class="absolute top-3 left-2 h-5 w-5 pointer-events-none" src="assets/icons/key_vertical.svg" alt="">
        <input
          class="w-80 border rounded py-2 !bg-white"
          [type]="passwordVisible ? 'text' : 'password'"
          pInputText
          id="password_label"
          [(ngModel)]="password"
          autocomplete="off"
        />
        <label class="pl-5" for="password_label">Enter password</label>
        <button type="button" (click)="togglePassword()" class="absolute top-3 right-3">
          <img
            class="h-5 w-5"
            [src]="passwordVisible ? 'assets/icons/visibility.svg' : 'assets/icons/visibility_off.svg'"
            alt="Toggle visibility"
          />
        </button>
        <p *ngIf="errors.password" role="alert" class="text-red-500 text-sm pl-2">{{ errors.password }}</p>
      </p-floatlabel>

      <div class="pl-25">
        <button (click)="register()" class="bg-black text-white px-14 py-2 rounded font-semibold hover:bg-gray-800">Register</button>
      </div>

      <div *ngIf="errors.server" class="flex flex-col justify-center items-center">
        <p role="alert" class="text-red-500 py-1 font-semibold rounded">{{ errors.server }}</p>
      </div>

      <div class="text-center text-sm space-y-2">
        <a class="block py-1" href="">Forgot password?</a>
        <a class="font-semibold py-1" href="/registerHub">Create Account?</a>
        <br>
        <a class="font-bold py-1" href="/login">Login?</a>
      </div>
    </div>
  </div>
</div>
