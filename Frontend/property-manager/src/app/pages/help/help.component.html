<!-- <app-header></app-header> -->

<div class="relative min-h-screen bg-white">

  
  <div
    class="absolute inset-x-0 top-0 h-90 bg-cover bg-center blur-sm opacity-70 bg-[url('/assets/images/background.jpg')]
           after:content-[''] after:absolute after:inset-x-0 after:bottom-0 after:h-16 after:bg-gradient-to-t after:from-white after:to-transparent">
  </div>

  <div class="relative p-8" [@fadeInStagger]>
    <!-- Title -->
    <div class="ml-15 mb-20 animate-item">
      <h2 class="text-3xl font-semibold font-lato text-black">Help settings</h2>
      <div class="w-60 h-1 bg-yellow-300 mt-2"></div>
    </div>

    <!-- Help options -->
    <div class="flex flex-wrap justify-center gap-8 animate-item">
      <!-- Reset Password -->
      <a [routerLink]="['/reset-password']"
        class="flex flex-col items-center bg-white justify-center border border-black text-black rounded-lg px-8 py-8 hover:bg-yellow-100 hover:mb-2 transition w-56"
        [ngStyle]="{'background-color': 'var(--bg-color)', 'color': 'var(--text-color)', 'border': '1px solid var(--border-color)'}">
        <img src="/assets/icons/screwdriver2.svg" alt="Reset" class="h-20 w-20 mb-2" />
        <span class="font-semibold text-lg font-lato">Reset password</span>
      </a>

      <!-- FAQs -->
      <div class="relative">
        <button (click)="toggleFaqs()"
          class="flex flex-col items-center bg-white justify-center border border-black text-black rounded-lg px-8 py-8 hover:bg-yellow-100 hover:mb-2 transition w-56"
          [ngStyle]="{'background-color': 'var(--bg-color)', 'color': 'var(--text-color)', 'border': '1px solid var(--border-color)'}">
          <img src="/assets/icons/chat2.svg" alt="FAQs" class="h-20 w-20 mb-2" />
          <span class="font-semibold text-lg font-lato">FAQs</span>
        </button>
        <div *ngIf="showFaqs"
          class="absolute z-50 w-96 bg-white shadow-xl rounded-lg mt-2 left-1/2 transform -translate-x-1/2">
          <p-accordion>
            <p-accordionTab *ngFor="let item of faqItems" [header]="item['header']" class="text-black">
              {{ item['content'] }}
            </p-accordionTab>
          </p-accordion>
          <div class="p-4 text-right">
            <button (click)="showFaqs = false" class="text-sm text-yellow-600 hover:text-yellow-800">
              Close
            </button>
          </div>
        </div>
      </div>
      <!-- User Manual -->
      <a href= "https://github.com/COS301-SE-2025/Property-Management/blob/main/docs/Demo%203%20Documentation/Property%20Manager%20User%20Manual.pdf"
        target="_blank" rel="noopener noreferrer"
        class="flex flex-col items-center bg-white justify-center border border-black text-black rounded-lg px-8 py-8 hover:bg-yellow-100 hover:mb-2 transition w-56"
        [ngStyle]="{'background-color': 'var(--bg-color)', 'color': 'var(--text-color)', 'border': '1px solid var(--border-color)'}">
        <img src="/assets/icons/user-question.svg" alt="Manual" class="h-20 w-20 mb-2" />
        <span class="font-semibold text-lg font-lato">User manual</span>
      </a>
    </div>
    <div class="mt-24 mb-12 animate-item">
      <div class="max-w-3xl mx-auto bg-white  p-8 ">
        <h3 class="text-2xl font-bold text-center mb-6 flex items-center justify-center gap-2 text-black">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-yellow-500" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          Need Further Assistance?
        </h3>

        <div class="grid md:grid-cols-3 gap-6 text-center">
          <!-- Phone -->
          <div class="p-4 rounded-lg hover:bg-yellow-50 transition">
            <div class="flex flex-col items-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-500 mb-2" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
              <h4 class="font-bold text-lg mb-1 text-black">Call Us</h4>
              <p class="text-gray-600">+27 12 345 6789</p>
            </div>
          </div>

          <!-- Email -->
          <div class="p-4 rounded-lg hover:bg-yellow-50 transition">
            <div class="flex flex-col items-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-500 mb-2" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <h4 class="font-bold text-lg mb-1 text-black">Email Us</h4>
              <p class="text-gray-600">support&#64;propertypro.co.za</p>
            </div>
          </div>

          <!-- Hours -->
          <div class="p-4 rounded-lg hover:bg-yellow-50 transition">
            <div class="flex flex-col items-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-purple-500 mb-2" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <h4 class="font-bold text-lg mb-1 text-black">Available</h4>
              <p class="text-gray-600">Mon-Fri: 8am-5pm</p>
              <p class="text-gray-600">Sat: 9am-1pm</p>
            </div>
          </div>
        </div>

        <div class="mt-8 text-center text-sm text-gray-500">
          <p>Our support team typically responds within 1 business day</p>
        </div>
      </div>
    </div>
  </div>
</div>
