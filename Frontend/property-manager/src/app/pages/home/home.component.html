<!-- <app-header/> -->


<div class="mb-12 mt-8 ml-10 animate-item">
  <h2 class="text-2xl font-bold"
      [ngStyle]="{ 'background-color': 'var(--input-bg-color)', 'color': 'var(--input-text-color)' }">
    Your Properties
  </h2>
  <div class="w-[15rem] h-1 bg-yellow-300 mt-2"></div>
</div>

<div class="flex justify-center items-center mt-10" *ngIf="loading">
  <p-progressSpinner></p-progressSpinner>
</div>

<div class = "mt-5 ml-5 flex flex-col justify-center items-center" *ngIf="houses().length <= 0 && !loading">
  <img src="/assets/icons/empty-folder.svg" alt="No tasks" class="w-12 h-12 mb-4 opacity-60" />
  <p class = "text-md font-normal flex flex-col justify-center items-center pr-12 text-black dark:text-white">No properties created yet. Create one now</p>
</div>

<div [@floatUp] class = "flex flex-wrap justify-center gap-8 p-8" *ngIf="!loading">
    @for (house of houses(); track  house.buildingUuid)
    {
        <div class="hover:translate-y-2 transition-transform duration-200">
            <app-house-card [house]="house"/>
        </div>
    }
    @if(!bcUser)
    {
      <button (click)="RouteToCreateProperty()" class = "cursor-pointer hover:translate-y-1 transition-transform duration-200">
          <img class= "w-16 h-16" src= "assets/icons/add_circle.svg" alt="">
      </button>
    }
</div>
