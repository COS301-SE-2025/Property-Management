<div class="px-10 py-8" [ngStyle]="{ 'background-color': 'var(--bg-color)', 'color': 'var(--text-color)' }">
  <h2 class="text-2xl font-bold mb-2">Create New Property</h2>
  <div class="h-1 w-80 bg-yellow-400 mb-6"></div>
  <div class="h-1 w-64 mb-6" [ngStyle]="{ 'background-color': 'var(--accent-color)' }"></div>

  <div
    class="border rounded-lg p-12 shadow-sm max-w-6xl mx-auto"
    [ngStyle]="{ 'background-color': 'var(--card-bg)', 'color': 'var(--text-color)' }"
  >
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-2 gap-4">

      <div class="flex flex-col space-y-6">
        
        <div class="mb-8">
          <p-floatlabel>
            <input 
              id="name" 
              pInputText 
              formControlName="name" 
              class="w-full col-span-2" 
              style="width: 91%;" 
            />
            <label for="name">Property Name *</label>
          </p-floatlabel>
        </div>

        <div class="mb-8">
          <p-floatlabel>
            <input 
              id="area" 
              pInputText 
              formControlName="area" 
              type="number" 
              min="0" 
              step="0.01" 
              class="w-full col-span-2" 
              style="width: 91%;" 
            />
            <label for="area">Area (m²) *</label>
          </p-floatlabel>
        </div>

        <div class="mb-8">
          <p-floatlabel>
            <input 
              id="propertyValue" 
              pInputText 
              formControlName="propertyValue" 
              type="number" 
              min="0" 
              step="0.01" 
              class="w-full col-span-2" 
              style="width: 91%;" 
            />
            <label for="propertyValue">Property Value *</label>
          </p-floatlabel>
        </div>

        <div class="mb-8">
          <label for="coporateUuid" class="block mb-1 font-medium">Assign to Body Corporate </label>
          <p-dropdown
            id="coporateUuid"
            [options]="bodyCorporates"
            optionLabel="coporateName"
            optionValue="coporateUuid"
            formControlName="coporateUuid"
            [filter]="true"
            [showClear]="true"
            placeholder="Select a body corporate"
            class="w-full col-span-2"
            [style]="{ width: '91%' }">
            <ng-template pTemplate="item" let-corp>
              <div class="flex items-center gap-2">
                <span>{{ corp.coporateName }}</span>
              </div>
            </ng-template>
            <ng-template pTemplate="selectedItem" let-corp>
              <span *ngIf="corp">{{ corp.coporateName }}</span>
              <span *ngIf="!corp">Select a body corporate</span>
            </ng-template>
          </p-dropdown>
        </div>

        <button type="button" class="bg-yellow-400 px-4 py-2 rounded font-semibold mb-4 w-[91%]" (click)="showAddressModal = true">
          Pick Address
        </button>

        <div *ngIf="showAddressModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40">
          <div class="bg-white rounded-lg p-6 shadow-lg w-full max-w-xl relative">
            <button class="absolute top-2 right-2 text-gray-500" (click)="showAddressModal = false">&times;</button>
            <app-address-map [control]="addressControl" (addressSelected)="onAddressSelectedModal($event)"></app-address-map>
          </div>
        </div>
        
        <div class="mb-8">
          <div class="flex gap-4">
            <p-floatlabel class="w-full">
              <input id="address" pInputText formControlName="address" />
              <label for="address">Street Address *</label>
            </p-floatlabel>
            <p-floatlabel class="w-full">
              <input id="suburb" pInputText formControlName="suburb" />
              <label for="suburb">Suburb</label>
            </p-floatlabel>
          </div>
        </div>

        <div class="mb-8">
          <div class="flex gap-4">
            <p-floatlabel class="w-full">
              <input id="city" pInputText formControlName="city" />
              <label for="city">City</label>
            </p-floatlabel>
            <p-floatlabel class="w-full">
              <p-dropdown
                id="province"
                [options]="provinces"
                formControlName="province"
                [showClear]="true"
                placeholder="Select Province"
                class="w-full col-span-2"
                [style]="{ width: '82%' }">
              </p-dropdown>
            </p-floatlabel>
          </div>
        </div>

        <div class="mb-8">
          <div class="flex gap-4">
            <p-floatlabel class="w-full">
              <p-dropdown
                id="type"
                [options]="propertyTypes"
                formControlName="type"
                [showClear]="true"
                placeholder="Select Property Type"
                class="w-full col-span-2"
                [style]="{ width: '91%' }">
              </p-dropdown>
            </p-floatlabel>
          </div>
        </div>
      </div>

      <div class="flex flex-col items-center">
        <div class="flex items-center justify-center border rounded w-96 h-64 relative"
             [ngStyle]="{ 'background-color': 'var(--card-bg)' }">
          <div class="w-full h-full flex items-center justify-center">

            <img 
              *ngIf="imagePreview; else placeholderIcon" 
              [src]="imagePreview" 
              alt="Property Image" 
              class="w-full h-full object-contain"
            />

            <ng-template #placeholderIcon>
              <img src="https://img.icons8.com/ios/50/image.png" alt="upload icon" class="w-10 h-10 opacity-50" />
            </ng-template>

          </div>
          <input #fileInput id="image-upload" type="file" hidden (change)="onFileSelected($event)" />
        </div>
        <button type="button" class="text-xs mt-2 px-3 py-1 rounded bg-yellow-400 hover:bg-yellow-500 text-black font-semibold shadow" (click)="fileInput.click()">
          Upload Image
        </button>
      </div>

      <div class="col-span-2 flex justify-end mt-0">
        <button type="submit" [disabled]="form.invalid || isSubmitting" 
          class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-2 rounded font-semibold flex items-center gap-2"
          [class.opacity-50]="form.invalid || isSubmitting"
          [class.cursor-not-allowed]="form.invalid || isSubmitting">
          <span *ngIf="isSubmitting" class="animate-spin inline-block w-4 h-4 border-2 border-black border-t-transparent rounded-full"></span>
          {{ isSubmitting ? 'Creating...' : 'Create Property' }}
        </button>
      </div>

    </form>
