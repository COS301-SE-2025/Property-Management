<p-toast/>
<p-dialog header="Update house details?" [style]="{ width: '22rem'}" [(visible)]="displayDialog" [modal]="true">
   <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto max-w-lg flex flex-col items-center justify-center">
     <div class="mb-2 gap-2 flex flex-col items-center justify-center">
        <label for="inventory-item" class="font-semibold block text-gray-700 dark:text-gray-200">House name</label>
        <input id="inventory-item" class="border rounded bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100" pInputText formControlName="name" required>
    </div>
    <div class="mb-6 mt-7">
        <p class="font-bold pb-3 text-gray-700 dark:text-gray-200">Upload new house image</p>
        <p-fileupload #fileUpload name="file" mode="basic" chooseLabel="Choose" chooseIcon="pi pi-upload" accept="image/*" maxFileSize="1000000" (onSelect)="onFileSelect($event)"/>
    </div>
    <div class="flex flex-col items-center justify-center mb-3 gap-2">
        <label for="body-corporate-select" class="font-semibold block text-gray-700 dark:text-gray-200">Assign to body corporate</label>
        <p-select id="body-corporate-select" *ngIf="bodyCorporates.length > 0" class="w-full" [showClear]="true" [options]="bodyCorporates" optionLabel="corporateName" formControlName="corporateUuid" optionValue="corporateUuid" placeholder="Body corporate"></p-select>
    </div>
    <div class="mb-6 text-center">
        <p class="font-semibold text-red-500" *ngIf="updateError">Error adding new task</p>
    </div>
    <div class="flex justify-end mt-3">
        <button class="bg-gray-300 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-3 py-2 rounded mr-2 cursor-pointer hover:translate-y-1 transition-transform duration-200" (click)="closeDialog()">Cancel</button>
        <button type="submit" class="px-3 py-2 rounded cursor-pointer hover:translate-y-1 transition-transform duration-200" [class.bg-black]="form.valid" [class.bg-gray-200]="!form.valid" [class.text-white]="form.valid" [disabled]="!form.valid">Edit house</button>
    </div>
   </form>
</p-dialog>
