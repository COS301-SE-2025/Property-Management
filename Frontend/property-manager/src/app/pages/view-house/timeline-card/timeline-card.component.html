 <div class="flex flex-col pt-5 p-4 bg-gray-300 dark:bg-gray-500 rounded-xl shadow-md">   
    <p-card class="text-center bg-gray-50 dark:bg-gray-800 rounded-xl shadow-md">
        <ng-template #title>Timeline</ng-template>
        <p-timeline [value]="timeline()">
            <ng-template #content let-time>
                <div class="cursor-pointer hover:underline hover:translate-y-0.5 transition-transform duration-200" tabindex="0" role="button" (click)="showDetails(time)" (keydown.enter)="showDetails(time)" (keydown.space)="showDetails(time)">
                    {{ time.title }}
                </div>
            </ng-template>
            <ng-template #marker let-time>
                <div class="flex items-center justify-center w-6 h-6 rounded-full shadow-md bg-white dark:bg-gray-700">
                    @if(!darkMode)
                    {
                        <ng-container *ngIf="(time.status==='done'); else pending">
                            <img src="assets/icons/task_done.svg" alt="Done" class="w-5 h-5"/>
                        </ng-container>
                        <ng-template #pending>
                            <i class="pi pi-clock text-gray-800"></i>
                        </ng-template>
                    }
                    @else
                    {
                        <ng-container *ngIf="(time.status==='done'); else pending">
                            <img src="assets/icons/check_white.svg" alt="Done" class="w-5 h-5"/>
                        </ng-container>
                        <ng-template #pending>
                            <i class="pi pi-clock text-gray-200"></i>
                        </ng-template>
                    }
                </div>
            </ng-template>
        </p-timeline>
        <div class="mt-7">
            @if(!bcUser)
            {
                <button class="cursor-pointer hover:translate-y-2 transition-transform duration-200" (click)="timelineAddDialog.openDialog()">
                    <img class="h-8 w-8" src="assets/icons/add_circle_gray.svg" alt="add inventory">
                </button>
                <app-timeline-add-dialog #timelineAddDialog/>
            }
        </div>
    </p-card>
 </div>
