<p-toast/>
<p-dialog header="Add new task to timeline?" [style]="{ width: '45rem'}" [(visible)]="displayDialog" [modal]="true">
    <ng-template #header>
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="text-xl font-semibold">Add New Timeline Task</span>
        </div>
    </ng-template>
    <div class="p-text-secondary block mb-6 text-gray-600 dark:text-gray-300">
        Create a new maintenance task for your property timeline
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto max-w-lg">
        <div class = "flex flex-col mb-3 gap-2">
            <label for="timeline-task" class="font-bold">Task name</label>
            <input id="timeline-task" class="border rounded w-70 mx-auto px-2" type="text" formControlName="name" placeholder="Enter task name" required>
        </div>
        <div class = "flex flex-col mt-8 mb-4 gap-4">
            <label for="timeline-description" class="font-bold">Task description</label>
            <textarea id="timeline-description" class = "border rounded w-90 mx-auto h-20 px-2" formControlName = "description" placeholder="Describe the task in detail" required></textarea>
        </div>
        <div class="mb-6 pt-2">
            <p class="font-bold pb-2">Assign inventory items to task</p>
            <p-multiselect 
                id="inventoryItems" 
                [options]="inventoryItemsAvailable" 
                optionLabel="name" 
                optionValue="itemUuid" 
                class="border rounded w-75" 
                placeholder="Available Inventory Items"
                (onChange)="updateInventoryItemsUsed($event)"
            >
                 <ng-template let-item pTemplate="item">
                    <div class="flex justify-between w-full">
                        <span>{{item.name}}</span>
                        <span class="ml-2 text-gray-500">(Qty: {{item.quantityInStock}})</span>
                    </div>
                </ng-template>
            </p-multiselect>
            <div class="p-4 mt-2">
                <app-inventory-card 
                    *ngIf="inventoryItemsUsed" 
                    [inventory]="inventoryItemsUsed" 
                    [showAddButton]="false"
                    [readOnly]="true"
                    [capOriginal]="true"
                    (quantitiesChanged)="onQuantitiesChanged($event)"
                ></app-inventory-card>
            </div>
        </div>
        <div>
            <p-checkbox formControlName="allowContractor" [binary]="true"/>
            <span class="font-bold p-3">Allow contractor to see inventory?</span>
        </div>
        <div class = "mb-6 mt-10">
            <p class="font-bold pb-4">Upload picture of task for the contractors</p>
            <p-fileupload 
                #fileUpload name="file" 
                mode="basic" 
                chooseLabel="Choose" 
                chooseIcon="pi pi-upload" 
                accept="image/*" 
                maxFileSize="1000000" 
                (onSelect)="onFileSelect($event)" 
            />
        </div>
        <div class = "mb-6">
            <label for="timeline-dueDate" class="font-bold block">Proposed due date</label>
            <p-datepicker id="timeline-dueDate" formControlName="date" styleClass="w-75 p-3 h-12" [iconDisplay]="'input'" [showIcon]="true" size="small" [appendTo]="'body'" placeholder="Enter due date" required/>
        </div>
        <div class="pb-[5rem]">
            <label for="priority" class="font-semibold block pb-2">Assign a priority</label>
            <p-select 
                id="priority"
                [options]="priorities" 
                formControlName="priority"
                placeholder="Priority"
                optionLabel="label"
                optionStyleClass="styleClass"
            >
            <ng-template let-priority pTemplate="item">
                <span [class]="priority.styleClass">{{priority.label}}</span>
            </ng-template>
            </p-select>
        </div>
        <div class="mb-3 text-center">
            <p class = "font-semibold text-red-500" *ngIf="addError">Error adding new task</p>
        </div>
        <div class = "flex justify-end mt-3">
            <button class = "bg-gray-300 px-3 py-2 rounded mr-2 cursor-pointer hover:translate-y-1 transition-transform duration-200" (click)="closeDialog()">Cancel</button>
            <button type="submit" 
                class = "px-3 py-2 rounded cursor-pointer hover:translate-y-1 transition-transform duration-200"
                [class.bg-black]="form.valid"
                [class.bg-gray-200]="!form.valid"
                [class.text-white]="form.valid"
                [disabled]="!form.valid">
                Add Task
            </button>
        </div>
    </form>
</p-dialog>
