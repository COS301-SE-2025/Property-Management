<!-- <app-header></app-header> -->

<div class="min-h-screen bg-white p-8" [@fadeInStagger]
  [ngStyle]="{'background-color': 'var(--bg-color)', 'color': 'var(--text-color)'}">

  <!-- Title -->
  <div class="ml-25 mb-12 animate-item">
    <h2 class="text-3xl font-semibold font-lato text-black flex items-center gap-2"
      [ngStyle]="{'background-color': 'var(--input-bg-color)', 'color': 'var(--input-text-color)'}">
      <i class="pi pi-key text-yellow-500"></i> Password Reset
    </h2>
    <div class="w-60 h-1 bg-yellow-300 mt-2"></div>
  </div>

  <!-- Step 1: Request Reset Code -->
  <div *ngIf="step === 1"
    class="border border-gray-300 rounded-lg p-8 max-w-md mx-auto shadow-sm animate-item mb-8"
    [ngStyle]="{'background-color': 'var(--card-bg-color)', 'color': 'var(--text-color)', 'border': '1px solid var(--border-color)'}">

    <p class="font-semibold text-center mb-6 flex items-center justify-center gap-2">
      <i class="pi pi-envelope text-yellow-500"></i> Request Reset Code
    </p>

    <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 mb-4 bg-gray-300/30"
      [ngStyle]="{'background-color': 'var(--input-bg-color)', 'color': 'var(--input-text-color)'}">
      <i class="pi pi-user text-gray-500 mr-2"></i>
      <input
        type="email"
        placeholder="Email address"
        [(ngModel)]="email"
        class="w-full bg-transparent focus:outline-none"
      />
    </div>

    <button
      (click)="resetPassword()"
      class="bg-yellow-300 hover:bg-yellow-400 text-black font-semibold rounded-md px-4 py-2 w-full transition flex items-center justify-center gap-2"
    >
      <i class="pi pi-send"></i> Send Code
    </button>
  </div>

  <!-- Step 2: Confirm Reset -->
  <div *ngIf="step === 2"
    class="border border-gray-300 rounded-lg p-8 max-w-md mx-auto shadow-sm animate-item"
    [ngStyle]="{'background-color': 'var(--card-bg-color)', 'color': 'var(--text-color)', 'border': '1px solid var(--border-color)'}">

    <p class="font-semibold text-center mb-6 flex items-center justify-center gap-2">
      <i class="pi pi-lock text-yellow-500"></i> Confirm Reset
    </p>

    <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 mb-4 bg-gray-300/30"
      [ngStyle]="{'background-color': 'var(--input-bg-color)', 'color': 'var(--input-text-color)'}">
      <i class="pi pi-hashtag text-gray-500 mr-2"></i>
      <input
        type="text"
        placeholder="Confirmation Code"
        [(ngModel)]="confirmationCode"
        class="w-full bg-transparent focus:outline-none"
      />
    </div>

    <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 mb-4 bg-gray-300/30"
      [ngStyle]="{'background-color': 'var(--input-bg-color)', 'color': 'var(--input-text-color)'}">
      <i class="pi pi-lock text-gray-500 mr-2"></i>
      <input
        type="password"
        placeholder="New Password"
        [(ngModel)]="newPassword"
        class="w-full bg-transparent focus:outline-none"
      />
    </div>

    <button
      (click)="confirmResetPassword()"
      class="bg-green-500 hover:bg-green-600 text-white font-semibold rounded-md px-4 py-2 w-full transition flex items-center justify-center gap-2"
    >
      <i class="pi pi-check"></i> Confirm Reset
    </button>
  </div>

  <!-- Message -->
  <p class="text-center mt-6 text-sm font-medium"
    [ngClass]="{'text-green-600': message.toLowerCase().includes('success'), 'text-red-500': message.toLowerCase().includes('error') || message.toLowerCase().includes('fail')}">
    {{ message }}
  </p>
</div>
