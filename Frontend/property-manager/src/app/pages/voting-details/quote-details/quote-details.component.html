<p-dialog header="Quotation Details" [style]="{width: '35rem'}" [(visible)]="displayDialog" [modal]="true" styleClass="quote-dialog">
  <ng-template pTemplate="header">
    <div class="flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span class="text-lg font-semibold">Quotation Details</span>
    </div>
  </ng-template>

  <div *ngIf="quoteError" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4 mb-4">
    <div class="flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 mr-2" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
      </svg>
      <p class="font-semibold text-red-600 dark:text-red-400">Couldn't find quote, please try again</p>
    </div>
  </div>

  <div *ngIf="!quoteError" class="space-y-5 mt-5">
    <div class="flex items-center p-4 bg-gray-50 dark:bg-[#444] rounded-lg">
      <div class="bg-yellow-100 dark:bg-yellow-900 h-12 w-12 rounded-full flex items-center justify-center mr-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-600 dark:text-yellow-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Contractor</p>
        <p class="text-lg font-semibold text-gray-800 dark:text-white">{{ contractorDetails()?.name }}</p>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="bg-gray-50 dark:bg-[#444] p-4 rounded-lg">
        <p class="text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">Submitted On</p>
        <p class="text-gray-800 dark:text-white font-medium flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          {{ (quote()?.submitted_on ?? '') | formatDate}}
        </p>
      </div>
      
      <div class="bg-gray-50 dark:bg-[#444] p-4 rounded-lg">
        <p class="text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">Total Amount</p>
        <p class="text-xl font-bold">R{{ quote()?.amount | number}}</p>
      </div>
    </div>

    <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
      <button 
        type="button" 
        class="w-full flex items-center justify-center px-4 py-3 !bg-yellow-500 hover:!bg-yellow-600 dark:!bg-yellow-500 dark:!hover:bg-yellow-600 text-white dark:!text-black rounded-lg transition-colors duration-200 font-medium"
        (click)="viewQuotePDF()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        View Quote Document
      </button>
    </div>
  </div>
</p-dialog>
