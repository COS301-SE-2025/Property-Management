<p-card>
  <ng-template #title class="text-lg font-semibold">Voting results</ng-template>

  @if(error())
  {
    <p class="text-red-500">Error loading results</p>
  }
  @else {
    <p-table [value]="results()">
      <ng-template #header>
        <tr>
          <th>Contractor name</th>
          <th>Number of votes</th>
        </tr>
      </ng-template>    
      <ng-template #body let-vote>
        <tr>
          <td>{{ vote.contractorName }}</td>
          <td>{{ vote.votesFor }}</td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-card>
