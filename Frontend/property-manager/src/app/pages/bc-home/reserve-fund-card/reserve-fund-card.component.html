<p-card>
    <div class="flex flex-col items-center justify-center h-full">
        <div class="h-full w-full overflow-auto">
            <p class="text-2xl font-semibold ml-45 pb-5">Reserve fund Contribution Schedule</p>
            <p-table [value]="schedule()" [tableStyle]="{ 'min-width' : '40rem'}" [paginator]="true" [rows]="rows" [responsiveLayout]="'scroll'">
                <ng-template #header>
                    <tr>
                        <th pSortableColumn="UnitNo">
                            Unit No. <p-sortIcon field="UnitNo"/>
                        </th>
                        <th pSortableColumn="floorArea">
                            Floor Area <p-sortIcon field="floorArea"/>
                        </th>
                        <th pSortableColumn="quota">
                            Participation Quota <p-sortIcon field="quota"/>
                        </th>
                        <th pSortableColumn="annualContribution">
                            Annual Contribution <p-sortIcon field="annualContribution"/>
                        </th>
                    </tr>
                </ng-template>
                <ng-template #body let-schedule>
                    <tr>
                        <td>{{ schedule.unitName }}</td>
                        <td>{{ schedule.floorArea }} ms</td>
                        <td>{{ schedule.partipationQuota }}%</td>
                        <td>R {{ schedule.annualContribution | formatAmount }}</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="paginatorright">
                    <p-dropdown 
                    [options]="[5,10,20]" 
                    [(ngModel)]="rows" 
                    [appendTo]="'body'">
                    </p-dropdown>
                </ng-template>
            </p-table>
            <div class="flex flex-col justify-center items-center">
                 <button class = "cursor-pointer pt-6" (click)="reserveFund.openDialog()">
                    <img src = "assets/icons/edit.svg" alt="update reserve fund contribution">
                </button>
                <app-reserve-fund-dialog #reserveFund [originalContribution]="contri()"/>
            </div>
        </div>
    </div>
</p-card>
