<div class="bg-white dark:bg-[#595964] rounded-lg shadow-lg p-6">
  <h3 class="text-2xl font-semibold pb-5 mb-4 text-gray-800 dark:text-white">Inventory Anomalies</h3>
  
  <div *ngIf="anomalies().length === 0" class="text-center text-lg py-4 text-yellow-500">
      No inventory anomalies detected
  </div>
  
  <div *ngFor="let anomaly of anomalies()" class="p-4 border rounded-lg bg-gray-50 dark:bg-[#2d2d2d] dark:border-gray-600 mb-2">
      <div class="flex justify-between items-start">
          <div class="flex-1">
              <h4 class="font-medium text-gray-800 dark:text-white">{{ anomaly.name }}</h4>
              <div class="text-sm text-gray-600 dark:text-gray-300 mt-1">
                  <p>Proposed Stock: {{ anomaly.quantityInStock }}</p>
                  <p>Price: R{{ anomaly.price | formatAmount }}</p>
              </div>
              
              <div class="mt-3 pt-3 border-t border-gray-200 dark:border-gray-600">
                  <div class="flex items-center text-sm text-gray-700 dark:text-gray-300">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                      </svg>
                      <span class="font-medium">Building:</span> 
                      <span class="ml-1">{{ anomaly.houseName }}</span>
                  </div>
                  <div class="flex items-center text-sm text-gray-700 dark:text-gray-300 mt-1">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                      </svg>
                      <span class="font-medium">Trustee:</span> 
                      <span class="ml-1">{{ anomaly.email }}</span>
                  </div>
              </div>
          </div>
          
          <div class="flex flex-col space-y-1 ml-4 mt-7">
              <button 
                  class="px-3 py-1 bg-green-500 hover:bg-green-600 text-black text-sm rounded transition hover:translate-y-1"
                  (click)="approveAnomaly(anomaly)">
                  Approve
              </button>
              <button 
                  class="px-3 py-1 bg-red-500 hover:bg-red-600 text-black text-sm rounded transition hover:translate-y-1"
                  (click)="disapproveAnomaly(anomaly)">
                  Disapprove
              </button>
              <button 
                  class="px-3 py-1 bg-yellow-500 hover:bg-yellow-600 text-white text-sm rounded transition hover:translate-y-1"
                  (click)="revokeUser(anomaly)">
                  Revoke User
              </button>
          </div>
      </div>
  </div>
</div>
<p-toast/>
