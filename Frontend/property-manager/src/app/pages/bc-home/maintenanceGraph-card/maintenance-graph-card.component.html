<div class="h-full flex flex-col">
    <p-card class="flex flex-col h-full">
        <ng-template #title>
            <div class="flex justify-between items-center text-2xl font-semibold pb-5">
                <span>Budget over Time</span>
            </div>
        </ng-template>
        
        <div class="flex-1">
            <p-chart 
                #chart
                type="bar" 
                [data]="bcData()" 
                [options]="getChartOptions()"
                style="width: 100%; height: 100%;"
            />
        </div>
        
        <ng-container *ngIf="bcData().predictedInventoryBudget || bcData().predictedMaintenanceBudget">
            <p-divider class="my-3"></p-divider>
            
            <div class="text-sm font-medium text-gray-600 dark:text-gray-100 mb-2">Next Year's Budget Predictions</div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div *ngIf="bcData().predictedInventoryBudget" 
                     class="bg-yellow-50 dark:bg-gray-700 p-3 rounded-lg border-l-4 border-yellow-400">
                    <div class="flex items-center">
                        <i class="pi pi-box text-yellow-500 mr-2"></i>
                        <span class="font-medium text-gray-700">Inventory Budget</span>
                    </div>
                    <div class="text-lg font-semibold text-yellow-500 mt-1">
                        {{bcData().predictedInventoryBudget! | number:'1.2-2' }}
                    </div>
                </div>
                
                <div *ngIf="bcData().predictedMaintenanceBudget" 
                     class="bg-yellow-50 dark:bg-gray-700 p-3 rounded-lg border-l-4 border-yellow-400">
                    <div class="flex items-center">
                        <i class="pi pi-wrench text-yellow-500 mr-2"></i>
                        <span class="font-medium text-gray-700">Maintenance Budget</span>
                    </div>
                    <div class="text-lg font-semibold text-yellow-500 mt-1">
                        {{bcData().predictedMaintenanceBudget! | number:'1.2-2' }}
                    </div>
                </div>
            </div>
            
            <div class="text-xs text-gray-500 dark:text-gray-100 mt-2 italic">
                Predictions based on historical trends and current spending patterns
            </div>
        </ng-container>
    </p-card>
</div>
