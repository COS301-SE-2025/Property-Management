<div class="max-w-lg mx-auto mt-10 p-6 bg-white rounded shadow">
  <h2 class="text-xl font-bold mb-4">Request Inventory</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label>Project/Task</label>
      <select class="w-full border rounded p-2" formControlName="taskUuid">
        <option *ngFor="let task of assignedTasks" [value]="task.uuid">{{ task.title }}</option>
      </select>
    </div>
    <div class="mb-4">
      <label>Inventory Items</label>
      <div *ngFor="let item of availableItems; let i = index" class="flex items-center mb-2">
        <input type="checkbox" [formControl]="itemControls[i].selected" />
        <span class="ml-2">{{ item.name }} ({{ item.quantityInStock }})</span>
        <input type="number" class="ml-4 w-20 border rounded p-1"
              [formControl]="itemControls[i].quantity"
              [min]="1"
              [max]="item.quantityInStock"
              [disabled]="!itemControls[i].selected.value" />
      </div>
    </div>
    <button type="submit" class="bg-yellow-400 px-4 py-2 rounded" [disabled]="form.invalid || loading">
      Request Inventory
    </button>
    <div *ngIf="error" class="text-red-500 mt-2">{{ error }}</div>
  </form>
</div>
