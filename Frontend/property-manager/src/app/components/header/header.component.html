<div class="flex flex-col" [ngStyle]="{ 'background-color': 'var(--bg-color)' }">
  <!-- Name -->
  <div class="flex flex-row items-center px-4 py-2">
    <img src="assets/images/logo.png" class="w-16 h-12 ml-8" alt="logo">
    <p class="font-medium text-xl">Property Manager</p>

    <div class="flex gap-8 ml-12">
      <ng-container *ngFor="let link of navLinks">
        <a
          *ngIf="link.show"
          [routerLink]="link.route"
          routerLinkActive="text-yellow-500"
          class="text-gray-700 hover:text-yellow-500 font-semibold transition"
        >
          {{ link.label }}
        </a>
      </ng-container>
    </div>

    <!-- Notifications Button -->
    <div class="ml-auto flex items-center">
      <button
        class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 relative mr-4"
        (click)="openNotifications()"
        aria-label="Open notifications"
      >
        <i class="pi pi-bell" style="font-size: 1.5rem;"></i>
        <span
          *ngIf="unreadCount > 0"
          class="absolute top-0 right-0 bg-red-500 text-white rounded-full px-1 text-xs"
        >
          {{ unreadCount }}
        </span>
      </button>

      <!-- Settings and Profile Buttons -->
      <div class="relative flex">
        <button class="cursor-pointer pr-3" (click)="dropDownSettings()">
          <img
            [src]="isDarkMode ? 'assets/icons/settings_gray.svg' : 'assets/icons/settings.svg'"
            class="w-9 h-9"
            alt="Settings"
          >
        </button>
        <button class="cursor-pointer" (click)="dropDownProfile()">
          <img
            [src]="isDarkMode ? 'assets/icons/profile_gray.svg' : 'assets/icons/profile.svg'"
            class="w-9 h-9"
            alt="Profile"
          >
        </button>

        <!-- Profile Dropdown -->
        <div
          *ngIf="dropDownProfileOpen"
          class="absolute right-1 top-14 bg-white border rounded shadow-md w-28 z-50 dark:bg-[#3d444d]"
        >
          <button
            *ngIf="isContractor"
            class="block text-yellow-500 w-full px-3 py-1 hover:bg-gray-100 cursor-pointer border-b border-gray-400"
          >
            <a href="/contractor-prof">View profile</a>
          </button>
          <button
            class="block text-yellow-300 w-full px-3 py-1 hover:bg-gray-100 cursor-pointer border-b border-gray-200"
          >
            <a href="/help">Help?</a>
          </button>
          <button
            (click)="signOut()"
            class="block text-red-500 w-full px-3 py-1 hover:bg-gray-100 cursor-pointer border-b border-gray-200"
          >
            Sign out
          </button>
        </div>

        <!-- Settings Dropdown -->
        <div
          *ngIf="dropDownSettingsOpen"
          class="absolute right-1 top-18 border rounded shadow-md w-38 z-50"
          [ngStyle]="{ 'background-color': 'var(--bg-color)' }"
        >
          <div class="flex justify-end px-2 pt-2">
            <button
              (click)="dropDownSettingsOpen = false"
              aria-label="Close settings"
              class="text-gray-400 hover:text-yellow-500 text-xl font-bold focus:outline-none"
            >
              &times;
            </button>
          </div>
          <div class="flex items-center justify-between px-6 py-2">
            <!-- Moon Icon -->
            <svg
              [ngClass]="{'opacity-60': !isDarkMode, 'opacity-100': isDarkMode}"
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 mr-2 transition-opacity"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"
              />
            </svg>
            <!-- Slider Switch -->
            <label class="relative inline-flex items-center cursor-pointer mx-2">
              <input
                type="checkbox"
                class="sr-only peer"
                [checked]="!isDarkMode"
                (change)="toggleDarkMode()"
              />
              <div
                class="w-12 h-6 bg-gray-300 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-yellow-400 rounded-full peer dark:bg-gray-700 transition"
              ></div>
              <div
                class="absolute left-0.5 top-0.5 w-5 h-5 bg-white border border-gray-300 rounded-full shadow transform transition peer-checked:translate-x-6"
              ></div>
            </label>
            <!-- Sun Icon -->
            <svg
              [ngClass]="{'opacity-100': !isDarkMode, 'opacity-60': isDarkMode}"
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 ml-2 transition-opacity"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M6.343 17.657l-1.414 1.414M17.657 17.657l-1.414-1.414M6.343 6.343L4.929 7.757"
              />
            </svg>
          </div>
          <button
            class="block text-yellow-500 w-full text-left px-3 py-1 hover:bg-gray-100 cursor-pointer"
          >
            Change font size
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Breadcrumb -->
  <div class="pl-5" [ngStyle]="{ 'background-color': 'var(--bg-color)' }">
    <p-breadcrumb class="max-w-full" [model]="items">
      <ng-template #item let-item>
        <ng-container *ngIf="item.route && !item.active; else elseBlock">
          <a [routerLink]="item.route" class="p-breadcrumb-item-link">
            <span [ngClass]="[item.icon ? item.icon : '', 'text-color']"></span>
            <span class="text-primary font-semibold">{{ item.label }}</span>
          </a>
        </ng-container>
        <ng-template #elseBlock>
          <span class="text-color">
            <span *ngIf="item.icon" [ngClass]="item.icon"></span>
            {{ item.label }}
          </span>
        </ng-template>
      </ng-template>
    </p-breadcrumb>
  </div>

  <!-- Bar -->
  <div class="propertyYellow-bg h-4 w-full"></div>
</div>
