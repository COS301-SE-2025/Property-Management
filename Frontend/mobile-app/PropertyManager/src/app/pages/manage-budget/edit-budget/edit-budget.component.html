<ion-modal [isOpen]="displayModal" class="dark:bg-gray-700">
  <ng-template>
    <ion-header>
      <ion-toolbar class="dark:bg-gray-800">
        <ion-buttons slot="start">
          <ion-button (click)="closeModal()" class="dark:text-white">Cancel</ion-button>
        </ion-buttons>
        <ion-buttons slot="end">
          <ion-button (click)="confirm()" class="dark:text-white" [strong]="true">Confirm</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <div class="flex flex-col justify-center items-center gap-2 mt-4">
        <form [formGroup]="form" (ngSubmit)="confirm()">
          <p class="text-gray-700 dark:text-gray-200 pl-2 pb-2">Add Remaining budget?</p>
          <ion-item lines="none">
            <ion-input
              class="dark:text-gray-300"
              [label]="'Update ' +  budgetType() + ' amount'"
              labelPlacement="stacked"
              formControlName="updatedBudget"
              (ionInput)="onBudgetUpdate($event)"
            ></ion-input>
          </ion-item>
          <div class="w-full px-4">
            <p-slider formControlName="updatedBudget" [min]="0" [max]="oldBudgetAmount()*2" (onSlideEnd)="onSliderChange($event)" class="w-full" styleClass="yellow-slider"/>
          </div>
          <p class="text-red-500 px-4 mt-4" *ngIf="form.get('updatedBudget')?.hasError('required') && form.get('updatedBudget')?.touched">Field is required</p>
          <p class="text-red-500 px-4 mt-4" *ngIf="form.get('updatedBudget')?.hasError('min') && form.get('updatedBudget')?.touched">Field is required</p>
        </form>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
