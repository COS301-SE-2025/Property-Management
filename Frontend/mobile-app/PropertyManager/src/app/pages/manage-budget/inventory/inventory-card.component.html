  <ion-card class="dark:bg-gray-900">

    <ion-card-header>
      <ion-card-title class="dark:text-white">Inventory Budget</ion-card-title>
      <ion-card-subtitle>
        <div class = "flex items-center justify-center gap-2">
            <p class ="font-semibold mt-2">Remaining Allocated budget: </p>
            <p class="text-yellow-500 text-lg font-semibold mt-2">R {{ (budget().inventoryBudget - budget().inventorySpent) | formatAmount }}</p>
        </div>
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <div class="flex flex-col items-center justify-center">

        <p>Inventory expenditure</p>
        <p-table [value] = "inventoryUsage()">
            <ng-template #header>
            <tr>
                <th pSortableColumn="name">
                    Description <p-sortIcon field="name"/>
                </th>
                <th pSortableColumn="quantityInStock">
                    Quantity <p-sortIcon field="quantityInStock"/>
                </th>
                <th pSortableColumn="contractorName">
                    Used by contractor <p-sortIcon field="contractorName"/>
                </th>
            </tr>
            </ng-template>
            <ng-template #body let-usage>
            <tr>
                <td>{{ usage.itemName }}</td>
                <td>{{ usage.quantityUsed }}</td>
                <td>{{ usage.contractorName }}</td>
            </tr>
            </ng-template>
        </p-table>
    
        <button class = "cursor-pointer pt-6" (click)="editBudget.openModal()">
            <img src = "assets/icons/edit.svg" alt="edit maintainence budget">
        </button>
        <app-edit-budget #editBudget [budgetType]="'inventory'" [oldBudgetAmount]="budget().inventoryBudget" [budget]="budget()"></app-edit-budget>
      </div>
    </ion-card-content>
</ion-card>
