<ion-content class="ion-padding dark:bg-gray-500" [@fadeInStagger]>
    <app-header />
  
  <!-- Alert -->
  <ion-alert
    [isOpen]="showAlert"
    [header]="alertHeader"
    [message]="alertMessage"
    [buttons]="alertButtons"
    (didDismiss)="onAlertDismiss()"
  ></ion-alert>

  <!-- Title -->
  <div class="ml-4 mt-4 mb-8 animate-item">
    <h1 class="text-2xl font-bold dark:text-white">Password Reset</h1>
    <div class="w-40 h-1 bg-yellow-400 mt-2"></div>
  </div>

  <!-- Form -->
  <ion-card class="max-w-md mx-auto animate-item">
    <ion-card-header>
      <ion-card-title class="text-center dark:text-white">
        {{ showConfirmationStep ? 'Enter Reset Code' : 'Enter Your Email' }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <!-- Email Input (always visible) -->
      <ion-item class="dark:bg-gray-600 rounded-lg mb-4" style="--border-width: 0; --inner-border-width: 0;">
        <ion-input
          type="email"
          [(ngModel)]="email"
          placeholder="Email address"
          class="dark:text-white"
          [disabled]="showConfirmationStep"
        ></ion-input>
      </ion-item>

      <!-- Confirmation Code Input (only show in second step) -->
      <div *ngIf="showConfirmationStep" class="space-y-4">
        <ion-item class="dark:bg-gray-600 rounded-lg" style="--border-width: 0; --inner-border-width: 0;">
          <ion-input
            type="text"
            [(ngModel)]="confirmationCode"
            placeholder="Confirmation code"
            class="dark:text-white"
          ></ion-input>
        </ion-item>

        <ion-item class="dark:bg-gray-600 rounded-lg" style="--border-width: 0; --inner-border-width: 0;">
          <ion-input
            type="password"
            [(ngModel)]="newPassword"
            placeholder="New password"
            class="dark:text-white"
          ></ion-input>
        </ion-item>

        <ion-item class="dark:bg-gray-600 rounded-lg" style="--border-width: 0; --inner-border-width: 0;">
          <ion-input
            type="password"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm new password"
            class="dark:text-white"
          ></ion-input>
        </ion-item>
      </div>

      <ion-button 
        expand="block" 
        (click)="resetPassword()"
        color="warning"
        class="ion-margin-top"
        [disabled]="isLoading"
      >
        <ion-spinner *ngIf="isLoading" class="mr-2"></ion-spinner>
        {{ 
          isLoading ? 'Processing...' : 
          showConfirmationStep ? 'Reset Password' : 'Send Reset Code' 
        }}
      </ion-button>

      <!-- Back to first step -->
      <div *ngIf="showConfirmationStep" class="text-center mt-4">
        <ion-button 
          fill="clear" 
          size="small" 
          (click)="showConfirmationStep = false"
          class="dark:text-white"
        >
          Back
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>

</ion-content>
<app-tab></app-tab>
