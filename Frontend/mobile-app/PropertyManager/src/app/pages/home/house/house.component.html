<div class = "shadow-md rounded-lg border text-center w-60">
  <ion-item class="pb-2">
    <button (click)="viewHouse(house().buildingUuid!)" class="w-full">
        <img [src] = "house().propertyImage" class="mx-auto object-cover w-40 h-28 rounded-md mt-2" alt="" rel="preconnect">
        <p class = "text-lg font-bold mt-3 dark:text-white"> {{ house().name }}</p>
        <p class = "text-gray-600 mb-1 truncate dark:text-white"> {{ house().address }}</p>
        <p class="inline-block px-2 py-1 rounded-full text-sm font-sm bg-orange-200 text-orange-800" *ngIf="!house().coporateUuid; else bodyCorporate">Owner</p>
          <ng-template #bodyCorporate>
              <p class="inline-block rounded-full px-2 py-1 text-sm font-sm bg-yellow-100 text-yellow-800 mt-2">Part of: {{ bcName() }}</p>
          </ng-template>
    </button>
  </ion-item>
</div>
