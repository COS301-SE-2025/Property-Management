<div class="shadow-md rounded-lg border border-gray-200 dark:border-gray-600 overflow-hidden w-60 bg-white dark:bg-gray-800 cursor-pointer">
  <div class="flex flex-col" (click)="viewHouse(house().buildingUuid!)">
    <img 
      [src]="house().propertyImage" 
      class="w-full h-36 object-cover" 
      alt="Property image"
      (error)="handleImageError($event)"
    >
    <div class="p-3">
      <h3 class="text-black dark:text-white text-lg font-semibold truncate">{{ house().name }}</h3>
      <p class="text-sm text-gray-600 dark:text-gray-300 mt-2 truncate">{{ house().address }}</p>
      
      <div class="mt-3">
        <p 
          *ngIf="!house().coporateUuid; else bodyCorporate" 
          class="inline-block px-3 py-1 rounded-full text-xs font-medium bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-200"
        >
          Owner
        </p>
        <ng-template #bodyCorporate>
          <p class="inline-block px-3 py-1 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200">
            Part of: {{ bcName() }}
          </p>
        </ng-template>
      </div>
    </div>
  </div>
</div>
