<ion-modal [isOpen]="displayModal">
  <ng-template>
    <ion-header class="bg-white dark:bg-gray-800">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="closeModal()" class="dark:text-white">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="bg-white dark:bg-gray-800">
      <div *ngIf="quoteError" class="flex flex-col justify-center items-center">
        <p class="font-semibold text-red-500">Couldnt find quote, please try again</p>
      </div>
      <div *ngIf="!quoteError" class="flex flex-col justify-center items-center gap-4 mt-6">
         <p class="text-lg dark:text-gray-200">Contractor Name: {{ contractorDetails()?.name }}</p>
          <p class="dark:text-gray-200">Submited quote on: {{ (quote()?.submitted_on ?? '') | formatDate}}</p>
          <p class="font-semibold dark:text-gray-200">Total amount: R{{ quote()?.amount}}</p>
          <div class="flex flex-col justify-center items-center">
            <p class="dark:text-gray-200">Quote:</p>
            <a [href]="quote()?.doc">View quote</a>
          </div>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
