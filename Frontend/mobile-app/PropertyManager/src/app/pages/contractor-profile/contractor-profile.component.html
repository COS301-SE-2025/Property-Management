<ion-content id="main-content" class="ion-padding dark:bg-gray-700">
  <div class="container mx-auto pt-3">
    <p class="text-l font-bold mb-2 dark:text-white">Edit Contractor Profile</p>
    <hr class="yellow-line mb-4" />
    <div 
      class="border border-gray-300 dark:border-gray-700 dark:bg-gray-300 rounded-lg flex items-center justify-center mb-6 cursor-pointer image-upload-box"
      style="height: 180px;"
      (click)="fileInput.click()"
    >
      <img *ngIf="imagePreviewUrl && !imageError" [src]="imagePreviewUrl" alt="Profile image" class="h-full w-full object-cover rounded-lg" />
      <ng-container *ngIf="!imagePreviewUrl || imageError">
        <img src="assets/icons/image_placeholder.svg" class="h-full w-full object-cover rounded-lg" alt="Image placeholder" style="height: 60px; width: 60px;" />
      </ng-container>
      <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden" />
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input formControlName="name" placeholder="Name *"></ion-input>
      </ion-item>
      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input formControlName="email" placeholder="Email *"></ion-input>
      </ion-item>
      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input formControlName="phone" placeholder="Phone *"></ion-input>
      </ion-item>
      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input formControlName="address" placeholder="Address *"></ion-input>
      </ion-item>
      <div class="grid grid-cols-2 gap-4">
        <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
          <ion-input formControlName="suburb" placeholder="Suburb"></ion-input>
        </ion-item>
        <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
          <ion-input formControlName="city" placeholder="City"></ion-input>
        </ion-item>
        <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
          <ion-input formControlName="postalCode" placeholder="Postal Code"></ion-input>
        </ion-item>
        <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
          <ion-input formControlName="reg_number" placeholder="Reg No. *"></ion-input>
        </ion-item>
      </div>

      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input formControlName="description" placeholder="Description *"></ion-input>
      </ion-item>
      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input formControlName="services" placeholder="Services *"></ion-input>
      </ion-item>

      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input formControlName="project_history" placeholder="Project History"></ion-input>
      </ion-item>

      <ion-item>
        <label>Attach Certifications</label>
        <input type="file" (change)="onCertUpload($event)" multiple />
      </ion-item>
      <ion-item>
        <label>Attach Licenses</label>
        <input type="file" (change)="onLicenseUpload($event)" multiple />
      </ion-item>
      <ion-item>
        <label>Attach ID</label>
        <input type="file" (change)="onIdUpload($event)" />
      </ion-item>
      <ion-item>
        <label>Attach Project Records</label>
        <input type="file" (change)="onProjectRecordsUpload($event)" multiple />
      </ion-item>
      <ion-item>
        <label>Attach Project Images</label>
        <input type="file" (change)="onProjectImagesUpload($event)" multiple />
      </ion-item>
      <ion-item *ngIf="submissionError">
        <ion-text color="danger">{{ submissionError }}</ion-text>
      </ion-item>
      <button ion-button expand="block" type="submit" [disabled]="form.invalid || isSubmitting"
        class="bg-yellow-300 text-black px-14 py-2 rounded font-semibold hover:bg-gray-800 w-full flex items-center justify-center">
        <ion-spinner *ngIf="isSubmitting" name="dots"></ion-spinner>
        {{ isSubmitting ? 'Saving...' : 'Save Profile' }}
      </button>
    </form>
    <div style="height: 60px;"></div>
  </div>
</ion-content>
<app-tab/>
