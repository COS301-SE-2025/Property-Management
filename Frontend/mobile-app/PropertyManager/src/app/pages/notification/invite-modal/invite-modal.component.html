<ion-modal [isOpen]="display" class="dark:bg-gray-800">
  <ng-template>
    <ion-header>
      <ion-toolbar class="dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
        <ion-title class="text-lg font-medium dark:text-white">Invitation</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="dark:bg-gray-800">
      <div class="flex flex-col items-center p-6 text-center">
        <div class="bg-yellow-200 dark:bg-yellow-900/30 rounded-xl p-6 w-full max-w-md mb-6">
          <p class="text-lg font-semibold text-gray-800 dark:text-yellow-100 mb-2">Confirm Invitation</p>
          <p class="text-gray-600 dark:text-gray-300 mb-1">
            <span class="font-medium text-gray-800 dark:text-white">{{ bodyCorporate }}</span>
          </p>
        </div>
        <p class="text-gray-800 dark:text-gray-300 mt-2">Do you want to accept this invitation?</p>
        <div class="flex flex-row justify-center gap-4 mt-4">
          <ion-button (click)="onDissaprove()" fill="clear" class="text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white">Decline</ion-button>
          <ion-button (click)="onJoin()" [strong]="true" fill="solid" color="primary" class="ml-2">Accept</ion-button>
        </div>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
