<ion-modal [isOpen]="displayModal" class="dark:bg-gray-700">
  <ng-template>
    <ion-header>
      <ion-toolbar class="dark:bg-gray-800">
        <ion-buttons slot="start">
          <ion-button (click)="closeModal()" class="dark:text-white">Cancel</ion-button>
        </ion-buttons>
        <ion-buttons slot="end">
          <ion-button (click)="confirm()" [strong]="true" class="dark:text-white">Confirm</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <form [formGroup]="form" (ngSubmit)="confirm()">
        <div class="flex flex-col justify-center items-center mt-4 space-y-2">
          <p class="text-gray-700 pl-2 pb-2 dark:text-gray-100">Add new item and update budget</p>
          <ion-item>
            <ion-input
              label="Inventory item name"
              labelPlacement="stacked"
              formControlName="inventoryName"
              class="dark:text-gray-200"
            ></ion-input>
            <p class="text-red-500" *ngIf="form.get('inventoryName')?.hasError('required') && form.get('inventoryName')?.touched">Field is required</p>
          </ion-item>
          <ion-item>
            <ion-input
              label="Price for one"
              labelPlacement="stacked"
              formControlName="itemPrice"
              class="dark:text-gray-200"
            ></ion-input>
            <p class="text-red-500" *ngIf="form.get('itemPrice')?.hasError('required') && form.get('itemPrice')?.touched">Field is required</p>
            <p class="text-red-500" *ngIf="form.get('itemPrice')?.hasError('min') && form.get('itemPrice')?.touched">Value must be positive</p>
          </ion-item>
          <ion-item>
            <ion-input
              label="Quantity bought"
              labelPlacement="stacked"
              formControlName="quantity"
              class="dark:text-gray-200"
            ></ion-input>
            <p class="text-red-500" *ngIf="form.get('quantity')?.hasError('required') && form.get('quantity')?.touched">Field is required</p>
            <p class="text-red-500" *ngIf="form.get('quantity')?.hasError('min') && form.get('quantity')?.touched">Value must be positive</p>
          </ion-item>
          <ion-item>
            <ion-input
              label="Bought on"
              labelPlacement="stacked"
              formControlName="datePurchased"
              class="dark:text-gray-200"
              type="date"
            ></ion-input>
          </ion-item>
          <div class="pt-5">
            <button type="submit" [disabled]="loading" class="bg-yellow-400 text-black px-3 py-1.5 rounded">
              <ng-container *ngIf="!loading; else loadingTemplate">
                Add item
              </ng-container>
              <ng-template #loadingTemplate>
                  <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" 
                        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
                      </path>
                  </svg>
              </ng-template>
            </button>
          </div>
          <p class="text-red-500" *ngIf="form.get('quantity')?.hasError('required') && form.get('quantity')?.touched">Field is required</p>
        </div>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
