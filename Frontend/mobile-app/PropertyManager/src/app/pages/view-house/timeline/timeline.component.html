<ion-card class="dark:bg-gray-900">
    <ion-card-header>
      <ion-card-title class="dark:text-white">Timeline</ion-card-title>
    </ion-card-header>
    
    <ion-card-content>
      <p-timeline [value]="VisibleTask" align="alternate">
          <ng-template #content let-time>
              <div tabindex="0" role="button" class="dark:text-white" (click)="openDetails(time)">
                  {{ time.title }}
              </div>
          </ng-template>
          <ng-template #marker let-time>
              <div class="flex items-center justify-center w-6 h-6 rounded-full shadow-md bg-white-200">
                  <ng-container *ngIf="(time.status==='done'); else pending">
                      <img src="assets/icons/task_done.svg" alt="Done" class="w-5 h-5" />
                  </ng-container>
                  <ng-template #pending>
                      <i class="pi pi-clock"></i>
                  </ng-template>
              </div>
          </ng-template>
      </p-timeline>
  
      <div class="mt-4 flex justify-center">
        <button *ngIf="timeline().length > 3" (click)="toggleShow()" class="p-1 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-gray-200 rounded-lg shadow-md">
            {{ toggleButton }}
        </button>
      </div>
      <div class = "mt-5 flex flex-col justify-center items-center">
          <button (click)="timelineAdd.openModal()" class="flex items-center gap-2 p-2 bg-yellow-400 text-black rounded-lg shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
            Add New Task
          </button>
          <app-add-timeline #timelineAdd/>
      </div>
    </ion-card-content>
</ion-card>
