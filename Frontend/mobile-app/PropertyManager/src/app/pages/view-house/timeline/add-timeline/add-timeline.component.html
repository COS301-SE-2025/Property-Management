<ion-modal [isOpen]="displayModal">
  <ng-template>
    <ion-header class="bg-white dark:bg-gray-700">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="closeModal()" class="dark:text-gray-200">Cancel</ion-button>
        </ion-buttons>
        <ion-buttons slot="end">
          <ion-button (click)="confirm()" [strong]="true" class="dark:text-gray-200">Confirm</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="bg-white dark:bg-gray-700">
      <form [formGroup]="form" (ngSubmit)="confirm()">
        <div class="flex flex-col justify-center items-center mt-4 space-y-2">
          <p class="text-gray-700 pl-2 pb-2 dark:text-gray-400">Add new maintenance task</p>
          <ion-item>
            <ion-input
              label="Task name"
              labelPlacement="stacked"
              formControlName="name"
              class="dark:text-gray-200"
            ></ion-input>
            <p class="text-red-500" *ngIf="form.get('name')?.hasError('required') && form.get('inventoryName')?.touched">Field is required</p>
          </ion-item>
          <ion-item>
            <ion-input
              class="dark:text-gray-200"
              label="Task description"
              labelPlacement="stacked"
              formControlName="description"
            ></ion-input>
            <p class="text-red-500" *ngIf="form.get('description')?.hasError('required') && form.get('itemPrice')?.touched">Field is required</p>
          </ion-item>
          <ion-item>
            <ion-select class="dark:text-white" placeholder="Assign inventory items" [multiple]="true" (ionChange)="updateInventoryItemsUsed($event)">
              @for(inventory of inventoryItemsAvailable; track inventory.itemUuid)
              {
                <ion-select-option [value]="inventory.itemUuid">{{ inventory.name}}  (Quantity: {{inventory.quantityInStock }})</ion-select-option>
              }
            </ion-select>
          </ion-item>
          <ion-item *ngIf="inventoryItemsUsed">
             <app-inventory 
                [inventory]="inventoryItemsUsed" 
                [showAddButton]="false"
                [readOnly]="true"
                [capOriginal]="true"
                (quantitiesChanged)="onQuantitiesChanged($event)"
            ></app-inventory>
          </ion-item>
          <ion-item class="pb-5 pt-2">
            <ion-input
              class="dark:text-gray-200"
              label="Proposed due date"
              labelPlacement="stacked"
              formControlName="date"
              type="date"
            ></ion-input>
            <p class="text-red-500" *ngIf="form.get('date')?.hasError('required') && form.get('itemPrice')?.touched">Field is required</p>
          </ion-item>
          <div class="px-5">
            <label for="priority" class="font-semibold block pb-3 dark:text-gray-200">Assign a priority</label>
            <p-select 
                id="priority"
                [options]="priorities" 
                formControlName="priority"
                placeholder="Priority"
                optionLabel="label"
                optionStyleClass="styleClass"
            >
              <ng-template let-priority pTemplate="item">
                  <span [class]="priority.styleClass">{{priority.label}}</span>
              </ng-template>
            </p-select>
          </div>
          <div class="pt-6 flex flex-col justify-center items-center">
            <p class="dark:text-gray-200">Take image of the task</p>
            <ion-button (click)="capturePhoto()" fill="clear">
              <ion-icon name="camera-outline"></ion-icon>
            </ion-button>

            <div *ngIf="capturedPhoto" class="mt-2 flex flex-col justify-center items-center">
              <p class="mb-2 dark:text-gray-200">Preview</p>
              <img [src]="capturedPhoto" alt="captured photo" class="max-w-xs max-h-40 rounded-md">
              <ion-button (click)="deletePhoto()" fill="clear" color="dark">
                <ion-icon name="trash-outline"></ion-icon>
              </ion-button>
            </div>
          </div>
          <div class="pt-5">
            <button type="submit" [disabled]="loading" class="bg-yellow-400 text-black px-3 py-1.5 rounded">
              <ng-container *ngIf="!loading; else loadingTemplate">
                Add task
              </ng-container>
              <ng-template #loadingTemplate>
                  <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" 
                        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
                      </path>
                  </svg>
              </ng-template>
            </button>
          </div>
        </div>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
