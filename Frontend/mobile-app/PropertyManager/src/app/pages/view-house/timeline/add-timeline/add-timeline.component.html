<ion-modal [isOpen]="displayModal">
  <ng-template>
    <ion-header class="bg-white dark:bg-gray-800">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="closeModal()" class="dark:text-gray-200">Cancel</ion-button>
        </ion-buttons>
        <ion-buttons slot="end">
          <ion-button (click)="confirm()" [strong]="true" class="dark:text-gray-200">Confirm</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="bg-white dark:bg-gray-800">
      <form [formGroup]="form" (ngSubmit)="confirm()">
        <div class="flex flex-col justify-center items-center mt-4 space-y-2">
          <p class="text-gray-700 pl-2 pb-2 dark:text-gray-400">Add new item and update budget</p>
          <ion-item>
            <ion-input
              label="Task name"
              labelPlacement="stacked"
              formControlName="name"
              class="dark:text-gray-200"
            ></ion-input>
            <p class="text-red-500" *ngIf="form.get('name')?.hasError('required') && form.get('inventoryName')?.touched">Field is required</p>
          </ion-item>
          <ion-item>
            <ion-input
              class="dark:text-gray-200"
              label="Task description"
              labelPlacement="stacked"
              formControlName="description"
            ></ion-input>
            <p class="text-red-500" *ngIf="form.get('description')?.hasError('required') && form.get('itemPrice')?.touched">Field is required</p>
          </ion-item>
          <ion-item>
            <ion-input
              class="dark:text-gray-200"
              label="Proposed due date"
              labelPlacement="stacked"
              formControlName="date"
              type="date"
            ></ion-input>
            <p class="text-red-500" *ngIf="form.get('date')?.hasError('required') && form.get('itemPrice')?.touched">Field is required</p>
          </ion-item>
          <div class="pt-4 flex flex-col justify-center items-center">
            <p class="dark:text-gray-200">Take image of the task</p>
            <ion-button (click)="capturePhoto()" fill="clear">
              <ion-icon name="camera-outline"></ion-icon>
            </ion-button>

            <div *ngIf="capturedPhoto" class="mt-2 flex flex-col justify-center items-center">
              <p class="mb-2">Preview</p>
              <img [src]="capturedPhoto" alt="captured photo" class="max-w-xs max-h-40 rounded-md">
              <ion-button (click)="deletePhoto()" fill="clear" color="dark">
                <ion-icon name="trash-outline"></ion-icon>
              </ion-button>
            </div>
          </div>
        </div>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
