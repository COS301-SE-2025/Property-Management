<ion-content>
  <div class="container mx-auto" [@fadeInStagger]>
    <app-header />

    <div class="mt-4 ml-3 animate-item">
      <p class="text-xl font-normal">Available Projects</p>
      <div class="w-24 h-1 bg-yellow-300 mt-2"></div>
    </div>

    <div *ngIf="tasks.length > 0; else noTasks" class="mt-6 flex flex-wrap justify-center gap-5 p-4">
      <div
        *ngFor="let task of tasks"
        class=" animate-item [15rem] h-[15rem] shadow-md rounded-xl overflow-hidden bg-white"
        (click)="goToQuotationPage(task)"
      >
        <img
          [src]="task.img"
          alt="Project Image"
          class="w-full h-40 object-cover"
        />
        <div class="p-3">
          <h3 class="text-black text-lg font-semibold">{{ task.title || 'Untitled Task' }}</h3>
          <p class="text-sm text-gray-600 mt-2">{{ task.des || 'No description' }}</p>
        </div>
      </div>
    </div>

    <ng-template #noTasks>
      <div class="flex flex-col items-center justify-center mt-20 text-gray-400 text-center animate-item">
        <img src="assets/icons/default.svg" alt="No tasks" class="w-24 h-24 mb-4 opacity-60" /> 
        <p class="text-xl font-semibold mb-2">No projects available</p>
        <p class="text-sm">Check back later or contact your admin for assistance.</p>
      </div>
    </ng-template>

    
  </div>
  <app-tab />
</ion-content>
