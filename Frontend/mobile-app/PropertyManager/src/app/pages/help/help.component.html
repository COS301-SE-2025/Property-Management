

<ion-content class="relative dark:bg-gray-700" [@fadeInStagger]>
    <app-header />
  <!-- Background -->
  <!-- <div class="help-background dark:bg-gray-700"></div> -->

  <!-- Title -->
  <div class="ion-padding animate-item">
    <h2 class="text-3xl font-semibold dark:text-white">Help settings</h2>
    <div class="w-60 h-1 bg-yellow-300 mt-2"></div>
  </div>

  <!-- Help options -->
  <div class="flex flex-wrap justify-center gap-4 p-4 animate-item">
    <!-- Reset Password -->
    <ion-button [routerLink]="['/reset-password']" fill="clear" class="help-option dark:bg-gray-500 rounded-lg">
      <div class="flex flex-col ml-4 mt-4 w-full h-full ">
        <ion-icon src="/assets/icons/screwdriver2.svg" class="h-20 w-20 mb-2"></ion-icon>
        <span class="font-semibold text-lg dark:text-white ">Reset password</span>
      </div>
    </ion-button>

    <!-- FAQs -->
    <ion-button (click)="toggleFaqs()" fill="clear" class="help-option dark:bg-gray-500 rounded-lg">
      <div class="flex flex-col items-center justify-center w-full h-full ">
        <ion-icon src="/assets/icons/chat2.svg" class="h-20 w-20 mb-2"></ion-icon>
        <span class="font-semibold text-lg dark:text-white">FAQs</span>
      </div>
    </ion-button>

    <!-- User Manual -->
    <ion-button href="https://github.com/COS301-SE-2025/Property-Management/blob/main/docs/Demo%203%20Documentation/Property%20Manager%20User%20Manual.pdf" 
                target="_blank" fill="clear" class="help-option dark:bg-gray-500 rounded-lg">
      <div class="flex flex-col items-center justify-center w-full h-full ">
        <ion-icon src="/assets/icons/user-question.svg" class="h-20 w-20 mb-2"></ion-icon>
        <span class="font-semibold text-lg dark:text-white">User manual</span>
      </div>
    </ion-button>
  </div>

  <!-- FAQs Modal -->
  <ion-modal [isOpen]="showFaqs" (didDismiss)="showFaqs = false">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>FAQs</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="showFaqs = false">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-accordion-group>
          <ion-accordion *ngFor="let item of faqItems">
            <ion-item slot="header">
              <ion-label>{{ item.header }}</ion-label>
            </ion-item>
            <div slot="content" class="ion-padding">
              {{ item.content }}
            </div>
          </ion-accordion>
        </ion-accordion-group>
      </ion-content>
    </ng-template>
  </ion-modal>

  <!-- Contact Section -->
  <div class="ion-padding mt-8 animate-item">
    <h3 class="text-2xl font-bold text-center mb-6 flex items-center justify-center gap-2 dark:text-white">
      <!-- <ion-icon name="mail-outline" class="text-yellow-500 text-3xl"></ion-icon> -->
      Need Further Assistance?
    </h3>

    <ion-grid>
      <ion-row>
        <!-- Phone -->
        <ion-col size="12" size-md="4">
          <ion-card class="text-center p-4 hover:bg-yellow-50 dark:bg-gray-500 dark:text-white">
            <ion-icon name="call-outline" class="text-blue-500 text-4xl mb-2"></ion-icon>
            <ion-card-header>
              <ion-card-title>Call Us</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <p>+27 12 345 6789</p>
            </ion-card-content>
          </ion-card>
        </ion-col>

        <!-- Email -->
        <ion-col size="12" size-md="4">
          <ion-card class="text-center p-4 hover:bg-yellow-50 dark:bg-gray-500 dark:text-white">
            <ion-icon name="mail-outline" class="text-green-500 text-4xl mb-2"></ion-icon>
            <ion-card-header>
              <ion-card-title>Email Us</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <p>support&#64;propertypro.co.za</p>
            </ion-card-content>
          </ion-card>
        </ion-col>

        <!-- Hours -->
        <ion-col size="12" size-md="4">
          <ion-card class="text-center p-4 hover:bg-yellow-50 dark:bg-gray-500">
            <ion-icon name="time-outline" class="text-purple-500 text-4xl mb-2"></ion-icon>
            <ion-card-header>
              <ion-card-title>Available</ion-card-title>
            </ion-card-header>
            <ion-card-content class="dark:text-white">
              <p>Mon-Fri: 8am-5pm</p>
              <p>Sat: 9am-1pm</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div class="text-center text-sm text-gray-500 dark:text-white mt-8">
      <p>Our support team typically responds within 1 business day</p>
    </div>
  </div>
  <app-tab />
</ion-content>
