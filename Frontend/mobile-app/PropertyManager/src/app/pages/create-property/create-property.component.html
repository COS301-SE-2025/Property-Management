<ion-content id="main-content" class="ion-padding dark:bg-gray-700">
    <p class="text-l font-bold mb-2 dark:text-white">Create New Property</p>
    <hr class="yellow-line mb-4;" />
    
    <!-- Camera Button - Always visible -->
    <div 
      class="border border-gray-300 dark:border-gray-700 dark:bg-gray-300 rounded-lg flex items-center justify-center mb-2 cursor-pointer image-upload-box"
      style="height: 60px;"
    >
      <ion-button (click)="capturePhoto()" fill="clear">
        <ion-icon name="camera-outline" class="text-2xl"></ion-icon>
        <span class="ml-2">Add Photo ({{ capturedPhotos.length }})</span>
      </ion-button>
    </div>

    <!-- Photo Gallery - Shows all captured photos -->
    <div *ngIf="capturedPhotos.length > 0" class="mb-4">
      <p class="text-sm font-semibold mb-2 dark:text-white">Photos ({{ capturedPhotos.length }})</p>
      <div class="grid grid-cols-2 gap-2">
        <div *ngFor="let photo of capturedPhotos; let i = index" class="relative">
          <img [src]="photo" alt="Property photo {{i + 1}}" class="w-full h-32 object-cover rounded-md border border-gray-300">
          <ion-button 
            (click)="deletePhoto(i)" 
            fill="solid" 
            color="danger" 
            size="small"
            class="absolute top-1 right-1"
            style="--padding-start: 8px; --padding-end: 8px; height: 28px;"
          >
            <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
          </ion-button>
          <div *ngIf="i === 0" class="absolute bottom-1 left-1 bg-yellow-300 text-black text-xs px-2 py-1 rounded">
            Primary
          </div>
        </div>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <ion-item class="rounded-lg border mt-4 border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input formControlName="name" placeholder="Property Name *"></ion-input>
      </ion-item>
      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input type="number" formControlName="area" placeholder="Area (m²) *"></ion-input>
      </ion-item>
      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input type="number" formControlName="propertyValue" placeholder="Property Value *"></ion-input>
      </ion-item>
      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-input formControlName="address" placeholder="Street Address *"></ion-input>
      </ion-item>
      <ion-label class="font-semibold dark:text-gray-200" style="display: block; padding-top: 5px; padding-left: 5px;">
        Assign to Body Corporate
      </ion-label>
      <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
        <ion-select formControlName="coporateUuid" placeholder="Select a body corporate" interface="action-sheet">
          <ion-select-option *ngFor="let corp of bodyCorporates" [value]="corp.coporateUuid">
            {{ corp.coporateName }}
          </ion-select-option>
        </ion-select>
      </ion-item>
      <div class="grid grid-cols-2 gap-4">
        <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
          <ion-input formControlName="suburb" placeholder="Suburb"></ion-input>
        </ion-item>
        <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
          <ion-input formControlName="city" placeholder="City"></ion-input>
        </ion-item>
        <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
          <ion-input formControlName="province" placeholder="Province"></ion-input>
        </ion-item>
        <ion-item class="rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-300">
          <ion-input formControlName="type" placeholder="Type *"></ion-input>
        </ion-item>
      </div>
      
      <ion-item *ngIf="submissionError">
        <ion-text color="danger">{{ submissionError }}</ion-text>
      </ion-item>
      
      <button ion-button expand="block" type="submit" [disabled]="form.invalid || isSubmitting"
        class="bg-yellow-300 text-black px-14 py-2 rounded font-semibold hover:bg-gray-800 w-full flex items-center justify-center">
        <ion-spinner *ngIf="isSubmitting" name="dots"></ion-spinner>
        {{ isSubmitting ? 'Creating...' : 'Create Property' }}
      </button>
    </form>
    <div style="height: 60px;"></div>
</ion-content>
<app-tab/>
