<ion-tabs class="border border-black dark:bg-gray-800 shadow-lg rounded-lg bg-white ion-safe-area-bottom">
  <ion-tab-bar slot="bottom">
    <ion-tab-button [attr.href]="type === 'contractor' ? '/contractor-home' : '/home'" class="dark:text-white">
      <ion-icon name="home-outline"></ion-icon>
      Home
    </ion-tab-button>
    <ion-tab-button href="/voting" *ngIf="type !== 'contractor'" class="dark:text-white">
      <ion-icon name="archive-outline"></ion-icon>
      Voting
    </ion-tab-button>
    <ion-tab-button href="/notifications" class="dark:text-white">
      <ion-icon name="notifications-outline"></ion-icon>
      Notifications
    </ion-tab-button>
    <ion-tab-button href="/profile" class="dark:text-white">
      <ion-icon name="person-outline"></ion-icon>
      Profile
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
