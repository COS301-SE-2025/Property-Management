<div class="flex flex-col mt-4 mx-4 rounded-xl dark:shadow-md bg-white dark:bg-gray-800">
  <div class="flex justify-between items-center px-6 py-4">
    <div class="flex flex-row items-center gap-3 justify-center w-full">
      <ion-icon name="grid-outline" class="dashboard-icon"></ion-icon>
      <img class="mb-2" style="height: 3rem; width: auto;" src="assets/images/logo.png" alt="App logo">
      <span class="font-bold text-xl text-black dark:text-white tracking-tight">Property Manager</span>
    </div>
    <ion-breadcrumbs class="ml-4">
      <ion-breadcrumb *ngIf="houseId && (isManageBudget() || isViewHouse())" href="/view-house/{{ houseId }}" class="dark:text-gray-200">View</ion-breadcrumb>
      <ion-breadcrumb *ngIf="houseId && isManageBudget()" href="/manage-budget/{{ houseId }}" class="dark:text-gray-200">Budget</ion-breadcrumb>
    </ion-breadcrumbs>
  </div>
  <div class="propertyYellow-bg h-1 w-full rounded-b-xl"></div>
</div>
