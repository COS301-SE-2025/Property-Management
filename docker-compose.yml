services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pg123}
      POSTGRES_DB: property_management
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${SPRING_DATASOURCE_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  flyway:
    image: flyway/flyway:11.9.0
    container_name: flyway
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Backend/property-management/migrations:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/property_management
      FLYWAY_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      FLYWAY_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pg123}
      FLYWAY_BASELINE_VERSION: "1"
      FLYWAY_BASELINE_DESCRIPTION: "Initial database import"
    networks:
      - app-network

  backend:
    build: ./Backend/property-management
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/property_management
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pg123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FORECAST_API_URL: http://forecast-api:5000
    depends_on:
      - postgres
      - flyway
      - forecast-api
    networks:
      - app-network

  forecast-api:
    build: ./Backend/property-management/python-forecast
    container_name: forecast-api
    ports:
      - "5000:5000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/property_management
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pg123}
    depends_on:
      - postgres
      - flyway
    volumes:
      - ./Backend/property-management/src/main/resources/application.yml:/app/application.yml:ro
    networks:
      - app-network

  # frontend:
  #   build: ./Frontend
  #   container_name: frontend
  #   ports:
  #     - "4200:4200"
  #   depends_on:
  #     - backend
  #     - forecast-api
  #   networks:
  #     - app-network

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./Backend/property-management/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  grafana-storage: